<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Site Word Counter icon</title>
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 512px; height: 512px; overflow: hidden; background: transparent; }
	body { position: relative; }
	.tile { position: absolute; inset: 16px; border-radius: 104px; background: linear-gradient(160deg, #121c38, #070b18); border: 3px solid rgba(90, 150, 255, .32); overflow: hidden; display: flex; align-items: center; justify-content: center; }
	.tile::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, rgba(30, 110, 255, .42), transparent 62%); }
	svg { position: relative; filter: drop-shadow(0 0 14px rgba(54, 226, 255, .9)) drop-shadow(0 0 40px rgba(31, 120, 255, .85)); }
	.slash { filter: drop-shadow(0 0 12px rgba(255, 154, 60, .85)); }
</style>
</head>
<body>
	<div class="tile">
		<!-- Tally marks: four strokes and an orange slash, matching the block icon. -->
		<svg width="340" height="280" viewBox="0 0 170 140">
			<g stroke="#eef8ff" stroke-width="12" stroke-linecap="round">
				<line x1="30" y1="20" x2="30" y2="120" />
				<line x1="65" y1="20" x2="65" y2="120" />
				<line x1="100" y1="20" x2="100" y2="120" />
				<line x1="135" y1="20" x2="135" y2="120" />
			</g>
			<line class="slash" x1="12" y1="104" x2="158" y2="36" stroke="#ffb35c" stroke-width="12" stroke-linecap="round" />
		</svg>
	</div>
</body>
</html>
